name: Fork test

# The checks upstream's CI runs, so that an upstream sync that rebases cleanly but breaks something
# is caught before a package is published, and so that a repair can be verified on GitHub: pushing any
# branch other than main (or tim, whose pushes run this through fork-build) runs it.

on:
  push:
    branches-ignore: [main, tim]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The runner's default package mirror (Azure's) has gone unanswering for hours at a time, which used to hang
      # this step. Each attempt is bounded; if the default mirror does not answer, others are tried over https.
      - name: Install SDL2
        run: |
          apt_opts="-o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
          install() {
            timeout 120 sh -c "sudo apt-get $apt_opts update && sudo apt-get $apt_opts install -y libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-gfx-dev"
          }
          install && exit 0

          sudo mkdir -p /tmp/apt-sources-backup
          sudo cp -a /etc/apt/sources.list /etc/apt/sources.list.d /tmp/apt-sources-backup/ 2>/dev/null || true
          for mirror in https://archive.ubuntu.com/ubuntu/ https://mirrors.edge.kernel.org/ubuntu/ https://mirror.us.leaseweb.net/ubuntu/; do
            echo "default mirror failed; trying $mirror"
            sudo cp -a /tmp/apt-sources-backup/sources.list.d/. /etc/apt/sources.list.d/ 2>/dev/null || true
            sudo sed -i "s|mirror+file:/etc/apt/apt-mirrors.txt|$mirror|; s|https\?://[a-z.]*archive.ubuntu.com/ubuntu/\?|$mirror|; s|https\?://security.ubuntu.com/ubuntu/\?|$mirror|" \
              /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true
            install && exit 0
          done
          exit 1

      - name: Formatting
        run: |
          unformatted=$(gofmt -l . | grep -v '^vendored/' | grep -v '^site/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Package layering
        run: go run ./tools/archcheck -v

      - name: Platform docs are current
        run: go run ./tools/gen-platform-docs -check

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race
