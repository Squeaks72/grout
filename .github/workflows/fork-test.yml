name: Fork test

# The checks upstream's CI runs, so that an upstream sync that rebases cleanly but breaks something
# is caught before a package is published, and so that a repair can be verified on GitHub: pushing any
# branch other than main (or tim, whose pushes run this through fork-build) runs it.

on:
  push:
    branches-ignore: [main, tim]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Pinned: ubuntu-latest moved to 26.04, whose package mirror was not serving yet, so this step hung.
      # A package mirror that stops answering used to hang this step for as long as the job was allowed to run.
      # Each attempt is bounded, and a slow mirror is given up on and tried again.
      - name: Install SDL2
        run: |
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for attempt in 1 2 3; do
            if timeout 240 sh -c "sudo apt-get $apt_opts update && sudo apt-get $apt_opts install -y libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-gfx-dev"; then
              exit 0
            fi
            echo "attempt $attempt failed, trying again"
          done
          exit 1

      - name: Formatting
        run: |
          unformatted=$(gofmt -l . | grep -v '^vendored/' | grep -v '^site/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Package layering
        run: go run ./tools/archcheck -v

      - name: Platform docs are current
        run: go run ./tools/gen-platform-docs -check

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race
