name: Fork test

# The checks upstream's CI runs, so that an upstream sync that rebases cleanly but breaks something
# is caught before a package is published, and so that a repair can be verified on GitHub: pushing any
# branch other than main (or tim, whose pushes run this through fork-build) runs it.

on:
  push:
    branches-ignore: [main, tim]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The runner's default package mirror (Azure's) has gone unanswering for hours at a time, which used to hang
      # this step. Each attempt is bounded; if the default mirror does not answer, the main Ubuntu archive is used.
      - name: Install SDL2
        run: |
          apt_opts="-o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
          install() {
            timeout 180 sh -c "sudo apt-get $apt_opts update && sudo apt-get $apt_opts install -y libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-gfx-dev"
          }
          install && exit 0
          echo "default mirror failed; using archive.ubuntu.com"
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|; s|http://azure.archive.ubuntu.com/ubuntu/\?|http://archive.ubuntu.com/ubuntu/|' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true
          install

      - name: Formatting
        run: |
          unformatted=$(gofmt -l . | grep -v '^vendored/' | grep -v '^site/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Package layering
        run: go run ./tools/archcheck -v

      - name: Platform docs are current
        run: go run ./tools/gen-platform-docs -check

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race
